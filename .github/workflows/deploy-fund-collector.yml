name: Deploy fund collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/fund-collector/**"
      - ".github/workflows/deploy-fund-collector.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker and Cron Trigger
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fund-collector
          command: deploy
