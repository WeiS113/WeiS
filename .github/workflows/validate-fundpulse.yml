name: Validate FundPulse collector

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/fundpulse-collector/**"
      - "app/fundpulse/**"
      - "app/page.tsx"
      - "app/api/cron/fundpulse-collect/**"
      - "app/api/finance/estimate/**"
      - "supabase/migrations/**"
      - "docs/fundpulse-collector-setup.md"
      - ".github/workflows/validate-fundpulse.yml"
  push:
    branches: [feat/fundpulse-cloud-data-foundation]
    paths:
      - "cloudflare/fundpulse-collector/**"
      - "app/api/cron/fundpulse-collect/**"
      - "app/api/finance/estimate/**"
      - "supabase/migrations/**"
      - "docs/fundpulse-collector-setup.md"
      - ".github/workflows/validate-fundpulse.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check collector JavaScript syntax
        run: node --check cloudflare/fundpulse-collector/worker.js
      - name: Lint collector
        run: npx eslint cloudflare/fundpulse-collector/worker.js
      - name: Build Next.js app
        env:
          # Build-only placeholders; no requests or production credentials are used.
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder-key
        run: npm run build
