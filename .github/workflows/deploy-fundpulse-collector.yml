name: Deploy FundPulse collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/fundpulse-collector/**"
      - ".github/workflows/deploy-fundpulse-collector.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy FundPulse Worker and Cron Trigger
        uses: cloudflare/wrangler-action@v3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fundpulse-collector
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
